# 上游写到域名及可选路径前缀；客户端 /v1 原样追加，避免 /v1/v1。
upstream = "https://anyrouter.top"
proxy_host = "127.0.0.1"
proxy_port = 15723
dashboard_port = 15724
data_dir = "data"
# 如需经过 Clash 等本地代理，取消下一行注释。
# outbound_proxy = "http://127.0.0.1:7890"
capture_bodies = true
body_limit = 2097152
retention = 1000
read_timeout = 600
